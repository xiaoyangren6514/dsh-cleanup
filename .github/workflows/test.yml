name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check every JavaScript file
        run: |
          for file in index.js client.js lib/*.js scripts/*.mjs test/*.mjs; do
            node --check "$file"
          done

      - name: Unit tests
        # `npm test` runs scripts/run-tests.mjs, which expands the test glob itself so the same
        # command works on Node 20 and 22 without relying on the shell or the test runner's globbing.
        run: npm test

      - name: Contract check
        run: npm run check

      - name: Package contents
        # The package ships extra files (SPEC, CHANGELOG, docs, locale mirrors); `npm pack --dry-run`
        # is the only step that proves the manifest actually includes them.
        run: npm pack --dry-run
